name: Build and Release .NET 10 App

on:
  push:
    tags:
      - 'v*' # Triggers workflow when you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write # Required to create a GitHub Release and upload assets

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish application
      run: dotnet publish -c Release -r win-x64 --self-contained false -o ./publish

    - name: Compress publish folder to ZIP
      run: Compress-Archive -Path ./publish/* -DestinationPath ./futureRosterMaker-win-x64.zip

    - name: Create GitHub Release & Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: ./futureRosterMaker-win-x64.zip
        generate_release_notes: true
